{{define "diagnose"}}
<div class="mb-4">
    <a href="{{.Prefix}}/" class="text-blue-600 hover:underline">&larr; Back to Dashboard</a>
</div>
<h1 class="text-2xl font-bold mb-4">Health Check</h1>

{{if .Error}}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{.Error}}
</div>
{{else}}
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Check</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Message</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
            {{range .Results}}
            <tr class="{{if .OK}}bg-green-100{{else}}bg-red-100{{end}}">
                <td class="px-4 py-2 text-sm font-medium text-gray-900">{{.CheckName}}</td>
                <td class="px-4 py-2 text-sm">
                    {{if .OK}}
                    <span class="text-green-800 font-semibold">OK</span>
                    {{else}}
                    <span class="text-red-800 font-semibold">{{.Severity}}</span>
                    {{end}}
                </td>
                <td class="px-4 py-2 text-sm text-gray-700">{{.Message}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
{{end}}
