{{define "query"}}
<div class="mb-4">
    <a href="{{.Prefix}}/" class="text-blue-600 hover:underline">&larr; Back to Dashboard</a>
</div>
<h1 class="text-2xl font-bold mb-4">{{.QueryName}}</h1>

{{if .Error}}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{.Error}}
</div>
{{else if .Rows}}
<div class="bg-white rounded-lg shadow overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                {{range .Headers}}
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{.}}</th>
                {{end}}
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {{range .Rows}}
            <tr class="hover:bg-gray-50">
                {{range .}}
                <td class="px-4 py-2 text-sm text-gray-900 whitespace-pre-wrap max-w-md truncate">{{.}}</td>
                {{end}}
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{else}}
<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">
    No results found.
</div>
{{end}}
{{end}}
