{{define "index"}}
<h1 class="text-2xl font-bold mb-6">PostgreSQL Performance Dashboard</h1>

<p class="text-gray-600 mb-6">Select a query from the sidebar to view PostgreSQL performance data, or run a health check to get a quick overview of your database's status.</p>

{{if .Actions}}
<div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-lg font-semibold mb-2 text-red-700">Administrative Actions</h2>
    <div class="space-x-2">
        {{range .Actions}}
        <form method="POST" action="{{$.Prefix}}/action/{{.}}" class="inline" onsubmit="return confirm('Are you sure?');">
            <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">{{.}}</button>
        </form>
        {{end}}
    </div>
</div>
{{end}}
{{end}}
